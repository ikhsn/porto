    <script>
      // GitHub Pages SPA redirect restore.
      // If 404.html stored a redirect URL, replay it as a history entry
      // so React/wouter sees the correct path on first load.
      (function () {
        var redirect = sessionStorage.getItem('spa_redirect');
        if (redirect) {
          sessionStorage.removeItem('spa_redirect');
          var url = new URL(redirect);
          if (url.pathname !== '/') {
            window.history.replaceState(null, '', url.pathname + url.search + url.hash);
          }
        }
      })();
    </script>
